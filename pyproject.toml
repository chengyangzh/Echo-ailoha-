[project]
name = "echo-agent-harness"
version = "0.19.0"
description = "Echo: a from-scratch minimal agent runtime for cross-domain structural analogy search."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "jsonschema>=4.22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
echo-agent = "agent_harness.cli:main"
agent-harness = "agent_harness.cli:main"
echo-eval = "agent_harness.eval_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "live: requires a configured real LLM API and makes a real API call",
  "external: makes a live read-only request to an external knowledge source",
]

[tool.setuptools.package-data]
agent_harness = ["data/*.json"]
